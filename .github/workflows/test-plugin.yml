name: Plugin Test Suite

on:
  push:
    branches: [master]
    paths:
      - 'SKILL.md'
      - 'skills/**'
      - 'framecraft.py'
      - '.mcp.json'
      - '.claude-plugin/**'
      - 'templates/**'
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  test-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Refresh OAuth token
        env:
          CLAUDE_REFRESH_TOKEN: ${{ secrets.CLAUDE_REFRESH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_REFRESH_TOKEN" ]; then
            echo "CLAUDE_REFRESH_TOKEN secret not set — skipping"
            echo "SKIP=true" >> "$GITHUB_ENV"
            exit 0
          fi
          # Exchange refresh token for a fresh access token
          RESPONSE=$(curl -s -X POST https://claude.ai/v1/oauth/token \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=refresh_token" \
            -d "refresh_token=$CLAUDE_REFRESH_TOKEN" \
            -d "client_id=9d1c250a-e61b-44d9-88ed-5944d1962f5e")
          ACCESS_TOKEN=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token',''))" 2>/dev/null)
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "Failed to refresh token: $RESPONSE"
            echo "SKIP=true" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "::add-mask::$ACCESS_TOKEN"
          echo "CLAUDE_CODE_OAUTH_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_ENV"
          echo "Token refreshed successfully"

      - uses: actions/checkout@v4
        if: env.SKIP != 'true'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        if: env.SKIP != 'true'
        uses: astral-sh/setup-uv@v4

      - name: Install Node.js
        if: env.SKIP != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ffmpeg
        if: env.SKIP != 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        if: env.SKIP != 'true'
        run: uv sync && uv run playwright install chromium --with-deps

      - name: Install Claude Code
        if: env.SKIP != 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Check plugin structure
        if: env.SKIP != 'true'
        run: |
          echo "Checking plugin files..."
          for f in ".claude-plugin/plugin.json" ".claude-plugin/marketplace.json" ".mcp.json" "skills/demo-video/SKILL.md" "framecraft.py"; do
            if [ -f "$f" ]; then
              echo "  OK $f"
            else
              echo "  MISSING $f"
              exit 1
            fi
          done

      - name: Generate, validate & review demos
        if: env.SKIP != 'true'
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          PLUGIN_DIR="$(pwd)"
          TEST_DIR="$PLUGIN_DIR/.test-runs/$RUN_ID"
          EXAMPLES_DIR="$PLUGIN_DIR/output/examples"
          RESULTS_FILE="$TEST_DIR/results.md"
          mkdir -p "$TEST_DIR" "$EXAMPLES_DIR"

          PASS=0
          FAIL=0

          # Rotate through scenarios — one per run, cycles every 5 runs
          ALL_SCENARIOS=(
            "password-manager|VaultKey|Make a 15-second teaser video for a password manager extension called VaultKey. 3 scenes max: hook, feature, CTA."
            "weather-app|SkyPulse|Make a 15-second teaser for a weather app called SkyPulse. 3 scenes max: radar view, alerts, CTA. Dark UI."
            "cli-tool|turbotest|Make a 15-second teaser for a CLI tool called turbotest that runs tests 10x faster. 3 scenes max: before/after, CTA."
            "note-taking|ThinkPad|Make a 15-second teaser for a note app called ThinkPad. 3 scenes max: editor, search, CTA. Minimal."
            "api-monitor|PingCraft|Make a 15-second teaser for an API monitor called PingCraft. 3 scenes max: dashboard, alerts, CTA."
          )
          RUN_NUM=$(gh api repos/${REPO}/actions/runs --jq '.total_count' 2>/dev/null || echo "$RUN_ID")
          IDX=$((RUN_NUM % ${#ALL_SCENARIOS[@]}))
          SCENARIOS=("${ALL_SCENARIOS[$IDX]}")

          cat > "$RESULTS_FILE" <<'HEADER'
          # framecraft plugin test results

          | # | Product | Video | Duration | Size | Review | Notes |
          |---|---------|-------|----------|------|--------|-------|
          HEADER

          EXAMPLE_LINKS=""

          for i in "${!SCENARIOS[@]}"; do
            IFS='|' read -r SLUG PRODUCT PROMPT <<< "${SCENARIOS[$i]}"
            NUM=$((i + 1))
            SCENE_DIR="$TEST_DIR/$SLUG"
            OUTPUT="$SCENE_DIR/demo.mp4"
            EXAMPLE_MP4="$EXAMPLES_DIR/${SLUG}.mp4"
            EXAMPLE_GIF="$EXAMPLES_DIR/${SLUG}.gif"
            mkdir -p "$SCENE_DIR"

            echo ""
            echo "=== TEST $NUM/5: $PRODUCT ($SLUG) ==="
            echo ""

            GENERATION_PROMPT="$PROMPT Save the output video to: $OUTPUT. After rendering, validate it using the framecraft validate_video_output tool. At the very end, print a single line: RESULT: <PASS or FAIL> | <duration in seconds> | <file size in MB>. Do NOT ask questions. Just build it."

            if claude -p \
              --no-session-persistence \
              --max-budget-usd 1.5 \
              --dangerously-skip-permissions \
              --plugin-dir "$PLUGIN_DIR" \
              "$GENERATION_PROMPT" \
              > "$SCENE_DIR/generation.log" 2>&1; then
              echo "  Session completed"
            else
              echo "  Session failed — log:"
              tail -20 "$SCENE_DIR/generation.log" 2>/dev/null || echo "  (no log)"
              echo "| $NUM | $PRODUCT | - | - | - | - | Session failed |" >> "$RESULTS_FILE"
              FAIL=$((FAIL + 1))
              continue
            fi

            # Find the video
            if [ ! -f "$OUTPUT" ]; then
              OUTPUT=$(find "$SCENE_DIR" -name "*.mp4" -type f 2>/dev/null | head -1)
            fi
            if [ -z "$OUTPUT" ] || [ ! -f "$OUTPUT" ]; then
              echo "  No video output"
              echo "| $NUM | $PRODUCT | - | - | - | - | No video output |" >> "$RESULTS_FILE"
              FAIL=$((FAIL + 1))
              continue
            fi

            # Validate
            DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$OUTPUT" 2>/dev/null | cut -d. -f1 || echo "0")
            SIZE_BYTES=$(stat --printf="%s" "$OUTPUT" 2>/dev/null || echo "0")
            SIZE_MB=$(echo "scale=1; $SIZE_BYTES / 1048576" | bc 2>/dev/null || echo "0")
            echo "  Video: ${DURATION}s, ${SIZE_MB}MB"

            # Copy + GIF
            cp "$OUTPUT" "$EXAMPLE_MP4"
            ffmpeg -y -i "$OUTPUT" \
              -vf "fps=12,scale=640:360:flags=lanczos,split[s0][s1];[s0]palettegen[p];[s1][p]paletteuse" \
              "$EXAMPLE_GIF" 2>/dev/null || true

            # LLM review
            echo "  Reviewing..."
            REVIEW_LOG=$(tail -100 "$SCENE_DIR/generation.log" 2>/dev/null)
            REVIEW=$(claude -p \
              --no-session-persistence \
              --model haiku \
              --max-budget-usd 0.2 \
              --tools "" \
              "Review this demo video for '$PRODUCT'. Log: $REVIEW_LOG. Video: ${DURATION}s, ${SIZE_MB}MB. Respond ONLY: VISUAL: <1-10> STORY: <1-10> PACING: <1-10> NARRATION: <1-10> OVERALL: <1-10> NOTES: <one line>" 2>/dev/null || echo "OVERALL: ? NOTES: Review failed")

            OVERALL=$(echo "$REVIEW" | grep -o 'OVERALL: [0-9]*' | grep -o '[0-9]*' || echo "?")
            NOTES=$(echo "$REVIEW" | grep 'NOTES:' | sed 's/NOTES: //' | tr -d '\n' || echo "No review")
            echo "$REVIEW" > "$SCENE_DIR/review.txt"
            echo "  Score: $OVERALL/10"

            VID_LINK="[MP4](https://github.com/${REPO}/releases/download/examples/${SLUG}.mp4)"
            echo "| $NUM | $PRODUCT | $VID_LINK | ${DURATION}s | ${SIZE_MB}MB | $OVERALL/10 | $NOTES |" >> "$RESULTS_FILE"
            EXAMPLE_LINKS="${EXAMPLE_LINKS}| ${PRODUCT} | ![${SLUG}](output/examples/${SLUG}.gif) | ${DURATION}s | $OVERALL/10 | [Watch](https://github.com/${REPO}/releases/download/examples/${SLUG}.mp4) |
          "
            PASS=$((PASS + 1))
          done

          echo ""
          echo "================================"
          echo "Results: $PASS passed, $FAIL failed"
          echo "================================"
          cat "$RESULTS_FILE"

          cp "$RESULTS_FILE" "$PLUGIN_DIR/test-results.md"
          printf '%s' "$EXAMPLE_LINKS" > "$TEST_DIR/example-links.txt"

          if [ "$FAIL" -gt 0 ]; then
            echo "Test failed"
            exit 1
          fi

      - name: Upload videos to release
        if: env.SKIP != 'true' && github.ref == 'refs/heads/master' && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create release if it doesn't exist
          gh release view examples 2>/dev/null || \
            gh release create examples \
              --title "Example Demos (auto-generated)" \
              --notes "Demo videos generated by the plugin test suite. Each from a single prompt." \
              --latest=false
          # Upload (overwrite if same name exists)
          gh release upload examples output/examples/*.mp4 --clobber 2>/dev/null || true

      - name: Update README with examples
        if: env.SKIP != 'true' && github.ref == 'refs/heads/master' && success()
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          TEST_DIR=".test-runs/$RUN_ID"
          if [ ! -f "$TEST_DIR/example-links.txt" ]; then
            echo "No example links"
            exit 0
          fi

          LINKS=$(cat "$TEST_DIR/example-links.txt")

          python3 << PYEOF
          import re

          links = """$LINKS"""

          section = """## Example demos (auto-generated)

          Every push to master triggers the plugin test suite. These demos were generated from a single prompt each.

          | Product | Preview | Duration | Score | Full video |
          |---------|---------|----------|-------|------------|
          """ + links.strip() + """

          *Generated by [test-plugin.yml](.github/workflows/test-plugin.yml) — scores from LLM review.*"""

          # Dedent (remove leading whitespace from heredoc)
          import textwrap
          section = textwrap.dedent(section)

          readme = open('README.md').read()
          if '## Example demos' in readme:
              readme = re.sub(r'## Example demos.*?(?=\n## |\Z)', section.strip(), readme, flags=re.DOTALL)
          elif '## Origin' in readme:
              readme = readme.replace('## Origin', section.strip() + '\n\n## Origin')
          elif '## License' in readme:
              readme = readme.replace('## License', section.strip() + '\n\n## License')
          else:
              readme += '\n\n' + section

          open('README.md', 'w').write(readme)
          PYEOF

      - name: Commit examples & updated README
        if: env.SKIP != 'true' && github.ref == 'refs/heads/master' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/examples/ README.md test-results.md 2>/dev/null || true
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "ci: update example demos from plugin test suite [skip ci]"
          git push

      - name: Upload artifacts
        if: always() && env.SKIP != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: |
            .test-runs/**/*
            test-results.md
            output/examples/
          retention-days: 30

      - name: Comment results on PR
        if: github.event_name == 'pull_request' && env.SKIP != 'true' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = fs.readFileSync('test-results.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## framecraft plugin test results\n\n${results}\n\n*Run: [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})*`
            });
