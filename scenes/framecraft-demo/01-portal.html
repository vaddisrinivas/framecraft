<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px; height: 1080px; overflow: hidden;
    background: #111318;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Inter', sans-serif;
  }

  /* Deep starfield - 3 layers for parallax depth */
  .stars-far {
    position: absolute; inset: 0;
    background-image:
      radial-gradient(1px 1px at 150px 180px, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 450px 620px, rgba(255,255,255,0.2), transparent),
      radial-gradient(1px 1px at 780px 90px, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 1100px 420px, rgba(255,255,255,0.2), transparent),
      radial-gradient(1px 1px at 1500px 800px, rgba(255,255,255,0.25), transparent),
      radial-gradient(1px 1px at 1750px 200px, rgba(255,255,255,0.2), transparent),
      radial-gradient(1px 1px at 300px 950px, rgba(255,255,255,0.15), transparent),
      radial-gradient(1px 1px at 900px 750px, rgba(255,255,255,0.2), transparent);
    opacity: 0;
    animation: fade-in 3s ease 0s forwards;
  }
  .stars-mid {
    position: absolute; inset: 0;
    background-image:
      radial-gradient(1.5px 1.5px at 400px 300px, rgba(197,213,255,0.5), transparent),
      radial-gradient(1.5px 1.5px at 850px 150px, rgba(124,106,245,0.4), transparent),
      radial-gradient(1.5px 1.5px at 1300px 600px, rgba(197,213,255,0.5), transparent),
      radial-gradient(1.5px 1.5px at 200px 700px, rgba(79,139,255,0.4), transparent),
      radial-gradient(1.5px 1.5px at 1600px 400px, rgba(197,213,255,0.3), transparent);
    opacity: 0;
    animation: fade-in 2s ease 0.5s forwards;
  }
  .stars-near {
    position: absolute; inset: 0;
    background-image:
      radial-gradient(2px 2px at 600px 400px, rgba(255,255,255,0.8), transparent),
      radial-gradient(2.5px 2.5px at 1200px 250px, rgba(197,213,255,0.9), transparent),
      radial-gradient(2px 2px at 350px 550px, rgba(124,106,245,0.7), transparent);
    opacity: 0;
    animation: fade-in 1.5s ease 1s forwards;
  }

  @keyframes fade-in { to { opacity: 1; } }

  /* Nebula fog */
  .nebula {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 600px 400px at 30% 40%, rgba(124,106,245,0.08) 0%, transparent 100%),
      radial-gradient(ellipse 500px 300px at 75% 65%, rgba(79,139,255,0.06) 0%, transparent 100%),
      radial-gradient(ellipse 800px 500px at 50% 50%, rgba(124,106,245,0.04) 0%, transparent 100%);
    opacity: 0;
    animation: nebula-in 3s ease 0.3s forwards;
  }
  @keyframes nebula-in { to { opacity: 1; } }

  /* The convergence - energy lines pulling inward */
  .convergence {
    position: absolute;
    width: 600px; height: 600px;
  }
  .energy-line {
    position: absolute;
    top: 50%; left: 50%;
    height: 2px;
    background: linear-gradient(90deg, transparent 0%, rgba(124,106,245,0.6) 50%, transparent 100%);
    transform-origin: left center;
    opacity: 0;
  }
  .el1 { width: 300px; animation: converge 1.5s cubic-bezier(0.16,1,0.3,1) 0.8s forwards; transform: rotate(0deg) translateX(100px); }
  .el2 { width: 250px; animation: converge 1.5s cubic-bezier(0.16,1,0.3,1) 0.9s forwards; transform: rotate(45deg) translateX(120px); background: linear-gradient(90deg, transparent, rgba(79,139,255,0.5), transparent); }
  .el3 { width: 280px; animation: converge 1.5s cubic-bezier(0.16,1,0.3,1) 1.0s forwards; transform: rotate(90deg) translateX(110px); }
  .el4 { width: 260px; animation: converge 1.5s cubic-bezier(0.16,1,0.3,1) 1.1s forwards; transform: rotate(135deg) translateX(130px); background: linear-gradient(90deg, transparent, rgba(197,213,255,0.4), transparent); }
  .el5 { width: 290px; animation: converge 1.5s cubic-bezier(0.16,1,0.3,1) 1.2s forwards; transform: rotate(180deg) translateX(100px); }
  .el6 { width: 240px; animation: converge 1.5s cubic-bezier(0.16,1,0.3,1) 1.3s forwards; transform: rotate(225deg) translateX(140px); background: linear-gradient(90deg, transparent, rgba(79,139,255,0.5), transparent); }
  .el7 { width: 270px; animation: converge 1.5s cubic-bezier(0.16,1,0.3,1) 1.4s forwards; transform: rotate(270deg) translateX(115px); }
  .el8 { width: 250px; animation: converge 1.5s cubic-bezier(0.16,1,0.3,1) 1.5s forwards; transform: rotate(315deg) translateX(125px); background: linear-gradient(90deg, transparent, rgba(197,213,255,0.4), transparent); }

  @keyframes converge {
    0% { opacity: 0; width: 300px; }
    40% { opacity: 0.8; }
    100% { opacity: 0; width: 0px; }
  }

  /* Central flash */
  .flash {
    position: absolute;
    width: 200px; height: 200px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(197,213,255,0.5) 20%, rgba(124,106,245,0.2) 40%, transparent 60%);
    opacity: 0;
    animation: flash-burst 0.8s cubic-bezier(0.16,1,0.3,1) 1.8s forwards;
  }
  @keyframes flash-burst {
    0% { opacity: 0; transform: scale(0); }
    30% { opacity: 1; transform: scale(1.5); }
    100% { opacity: 0.3; transform: scale(1); }
  }

  /* Title crystallizing from the energy */
  .title {
    position: relative; z-index: 10;
    font-size: 108px; font-weight: 900;
    letter-spacing: -3px;
    opacity: 0;
    animation: crystallize 1.2s cubic-bezier(0.16,1,0.3,1) 2.0s forwards;
  }
  .title span {
    background: linear-gradient(130deg, #fff 0%, #c5d5ff 50%, #7c6af5 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 60px rgba(124,106,245,0.8)) drop-shadow(0 0 120px rgba(124,106,245,0.3));
  }
  @keyframes crystallize {
    0% { opacity: 0; transform: scale(3); filter: blur(30px); letter-spacing: 40px; }
    40% { opacity: 0.8; filter: blur(4px); letter-spacing: 5px; }
    70% { filter: blur(0); }
    100% { opacity: 1; transform: scale(1); filter: blur(0); letter-spacing: -3px; }
  }

  /* Subtitle */
  .subtitle {
    position: relative; z-index: 10;
    font-size: 26px; color: #555a70; font-weight: 400;
    margin-top: 12px;
    opacity: 0;
    animation: fade-up 0.8s ease 2.8s forwards;
  }
  .subtitle em { font-style: normal; color: #7a8099; }

  @keyframes fade-up {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Ambient drift particles */
  .mote {
    position: absolute;
    border-radius: 50%;
    opacity: 0;
  }
  .m1 { width: 3px; height: 3px; top: 35%; left: 25%; background: #7c6af5; animation: mote-drift 5s ease 2.2s infinite; }
  .m2 { width: 2px; height: 2px; top: 55%; left: 72%; background: #4f8bff; animation: mote-drift 4s ease 2.5s infinite; }
  .m3 { width: 4px; height: 4px; top: 65%; left: 35%; background: #c5d5ff; animation: mote-drift 6s ease 2.0s infinite; }
  .m4 { width: 2px; height: 2px; top: 28%; left: 68%; background: #7c6af5; animation: mote-drift 4.5s ease 3.0s infinite; }
  .m5 { width: 3px; height: 3px; top: 75%; left: 58%; background: #4f8bff; animation: mote-drift 5.5s ease 2.8s infinite; }
  @keyframes mote-drift {
    0% { opacity: 0; transform: translateY(0) scale(0); }
    15% { opacity: 0.7; transform: translateY(-10px) scale(1); }
    100% { opacity: 0; transform: translateY(-80px) scale(0); }
  }

  .container {
    display: flex; flex-direction: column; align-items: center;
    position: relative;
  }
</style>
</head>
<body>
  <div class="stars-far"></div>
  <div class="stars-mid"></div>
  <div class="stars-near"></div>
  <div class="nebula"></div>

  <div class="mote m1"></div>
  <div class="mote m2"></div>
  <div class="mote m3"></div>
  <div class="mote m4"></div>
  <div class="mote m5"></div>

  <div class="container">
    <div class="convergence">
      <div class="energy-line el1"></div>
      <div class="energy-line el2"></div>
      <div class="energy-line el3"></div>
      <div class="energy-line el4"></div>
      <div class="energy-line el5"></div>
      <div class="energy-line el6"></div>
      <div class="energy-line el7"></div>
      <div class="energy-line el8"></div>
    </div>
    <div class="flash"></div>
    <h1 class="title"><span>framecraft</span></h1>
    <p class="subtitle">Demo videos. <em>Crafted from code.</em></p>
  </div>
</body>
</html>
