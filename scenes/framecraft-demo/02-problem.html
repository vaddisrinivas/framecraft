<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@400;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px; height: 1080px; overflow: hidden;
    background: #111318;
    background-image:
      radial-gradient(ellipse at 50% 40%, rgba(124,106,245,0.12) 0%, transparent 50%),
      radial-gradient(ellipse at 30% 70%, rgba(79,139,255,0.08) 0%, transparent 40%),
      radial-gradient(ellipse at 70% 30%, rgba(197,213,255,0.06) 0%, transparent 40%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: 'Inter', sans-serif;
    gap: 40px;
  }

  /* Quick, punchy — not a whole scene about problems */
  .question {
    font-size: 52px; font-weight: 800; color: #fff;
    opacity: 0;
    animation: fade-up 0.6s cubic-bezier(0.16,1,0.3,1) 0.3s forwards;
  }

  .pain-row {
    display: flex; gap: 32px;
  }
  .pain {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 28px;
    background: rgba(242,139,130,0.06);
    border: 1px solid rgba(242,139,130,0.15);
    border-radius: 12px;
    opacity: 0;
  }
  .pain:nth-child(1) { animation: pain-in 0.5s cubic-bezier(0.16,1,0.3,1) 0.8s forwards; }
  .pain:nth-child(2) { animation: pain-in 0.5s cubic-bezier(0.16,1,0.3,1) 1.1s forwards; }
  .pain:nth-child(3) { animation: pain-in 0.5s cubic-bezier(0.16,1,0.3,1) 1.4s forwards; }

  @keyframes pain-in {
    from { opacity: 0; transform: translateY(12px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .pain-icon { font-size: 28px; }
  .pain-text { font-size: 18px; color: #f28b82; font-weight: 600; }

  /* The flip */
  .flip {
    font-size: 36px; font-weight: 600;
    color: #7a8099;
    opacity: 0;
    animation: fade-up 0.8s ease 2.0s forwards;
  }
  .flip em {
    font-style: normal;
    color: #4ade80;
    font-weight: 800;
  }

  @keyframes fade-up {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
  <h1 class="question">Making demo videos is painful.</h1>

  <div class="pain-row">
    <div class="pain">
      <span class="pain-icon">&#9200;</span>
      <span class="pain-text">Hours of screen recording</span>
    </div>
    <div class="pain">
      <span class="pain-icon">&#9986;&#65039;</span>
      <span class="pain-text">Endless editing and retakes</span>
    </div>
    <div class="pain">
      <span class="pain-icon">&#128566;</span>
      <span class="pain-text">Still looks like a slideshow</span>
    </div>
  </div>

  <p class="flip">What if you could <em>describe</em> your demo instead?</p>
</body>
</html>
