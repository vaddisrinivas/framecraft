<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px; height: 1080px; overflow: hidden;
    background: #111318;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: 'Inter', sans-serif;
    gap: 24px;
    position: relative;
  }

  /* Deep cosmic background */
  .bg-layer {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 700px 500px at 50% 40%, rgba(124,106,245,0.18) 0%, transparent 100%),
      radial-gradient(ellipse 400px 300px at 30% 60%, rgba(79,139,255,0.08) 0%, transparent 100%),
      radial-gradient(ellipse 500px 400px at 70% 35%, rgba(197,213,255,0.05) 0%, transparent 100%);
    opacity: 0;
    animation: bg-in 2s ease 0s forwards;
  }
  @keyframes bg-in { to { opacity: 1; } }

  /* Stars */
  .stars {
    position: absolute; inset: 0;
    background-image:
      radial-gradient(1.5px 1.5px at 200px 300px, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 600px 150px, rgba(197,213,255,0.3), transparent),
      radial-gradient(2px 2px at 1000px 500px, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 1400px 200px, rgba(124,106,245,0.4), transparent),
      radial-gradient(1.5px 1.5px at 1700px 700px, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 350px 800px, rgba(79,139,255,0.3), transparent),
      radial-gradient(1px 1px at 1100px 900px, rgba(255,255,255,0.2), transparent);
    opacity: 0;
    animation: fade-in 2s ease 0.2s forwards;
  }
  @keyframes fade-in { to { opacity: 0.7; } }

  /* Motes */
  .mote {
    position: absolute; border-radius: 50%; opacity: 0;
  }
  .m1 { width: 3px; height: 3px; top: 30%; left: 20%; background: #7c6af5; animation: mote-up 5s ease 0.5s infinite; }
  .m2 { width: 2px; height: 2px; top: 60%; left: 75%; background: #4f8bff; animation: mote-up 4.5s ease 1s infinite; }
  .m3 { width: 4px; height: 4px; top: 70%; left: 40%; background: #c5d5ff; animation: mote-up 6s ease 0.2s infinite; }
  .m4 { width: 2px; height: 2px; top: 25%; left: 65%; background: #7c6af5; animation: mote-up 4s ease 1.5s infinite; }
  @keyframes mote-up {
    0% { opacity: 0; transform: translateY(0) scale(0); }
    15% { opacity: 0.6; transform: translateY(-15px) scale(1); }
    100% { opacity: 0; transform: translateY(-90px) scale(0); }
  }

  .logo {
    position: relative; z-index: 1;
    font-size: 108px; font-weight: 900;
    letter-spacing: -3px;
    opacity: 0;
    animation: logo-materialize 1.4s cubic-bezier(0.16,1,0.3,1) 0.3s forwards;
  }
  .logo span {
    background: linear-gradient(130deg, #fff 0%, #c5d5ff 50%, #7c6af5 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 80px rgba(124,106,245,0.6)) drop-shadow(0 0 160px rgba(124,106,245,0.2));
  }
  @keyframes logo-materialize {
    0% { opacity: 0; transform: scale(0.9); filter: blur(12px); }
    50% { filter: blur(2px); }
    100% { opacity: 1; transform: scale(1); filter: blur(0); }
  }

  .tagline {
    position: relative; z-index: 1;
    font-size: 26px; color: #7a8099; font-weight: 400;
    opacity: 0; animation: fade-up 0.8s ease 1.0s forwards;
  }

  .cta {
    position: relative; z-index: 1;
    font-size: 20px; font-weight: 600; color: #c5d5ff;
    padding: 14px 36px;
    border-radius: 30px;
    border: 1px solid rgba(124,106,245,0.3);
    background: linear-gradient(135deg, rgba(124,106,245,0.1), rgba(79,139,255,0.05));
    margin-top: 8px;
    opacity: 0;
    animation: fade-up 0.6s ease 1.4s forwards;
  }

  .badges {
    position: relative; z-index: 1;
    display: flex; gap: 14px; margin-top: 20px;
    opacity: 0; animation: fade-up 0.6s ease 1.8s forwards;
  }
  .badge {
    font-size: 13px; font-weight: 600; color: #444;
    padding: 6px 18px;
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 8px;
    background: rgba(255,255,255,0.02);
  }

  .self-ref {
    position: relative; z-index: 1;
    font-size: 14px; color: #333; margin-top: 24px;
    opacity: 0; animation: fade-up 0.5s ease 2.2s forwards;
  }
  .self-ref em { font-style: normal; color: #555; }

  @keyframes fade-up {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
  <div class="bg-layer"></div>
  <div class="stars"></div>
  <div class="mote m1"></div>
  <div class="mote m2"></div>
  <div class="mote m3"></div>
  <div class="mote m4"></div>

  <h1 class="logo"><span>framecraft</span></h1>
  <p class="tagline">Tell your LLM what you want. Get a polished demo video.</p>
  <div class="cta">github.com/vaddisrinivas/framecraft</div>
  <div class="badges">
    <div class="badge">LLM Skill &amp; Plugin</div>
    <div class="badge">10 Neural Voices</div>
    <div class="badge">Open Source</div>
    <div class="badge">CLI + Pipeline</div>
  </div>
  <p class="self-ref"><em>This entire video was one prompt to your LLM + framecraft.</em></p>
</body>
</html>
