<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px; height: 1080px; overflow: hidden;
    background: #0d0e12;
    background-image:
      radial-gradient(ellipse at 40% 45%, rgba(124,106,245,0.18) 0%, transparent 50%),
      radial-gradient(ellipse at 60% 55%, rgba(79,139,255,0.1) 0%, transparent 50%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: 'Inter', sans-serif; gap: 16px;
  }
  .logo {
    font-size: 72px; font-weight: 800;
    background: linear-gradient(130deg, #c5d5ff, #7c6af5);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    opacity: 0; animation: fade-up 0.8s ease 0.3s forwards;
  }
  .tagline {
    font-size: 24px; color: #7a8099; font-weight: 400;
    opacity: 0; animation: fade-up 0.8s ease 0.7s forwards;
  }
  .url {
    font-size: 22px; color: #7c6af5; font-weight: 600; margin-top: 8px;
    padding: 10px 28px; border: 1px solid rgba(124,106,245,0.3); border-radius: 24px;
    opacity: 0; animation: fade-up 0.6s ease 1.1s forwards;
    text-decoration: none;
  }
  .badges {
    display: flex; gap: 16px; margin-top: 24px;
    opacity: 0; animation: fade-up 0.6s ease 1.5s forwards;
  }
  .b {
    font-size: 14px; font-weight: 500; color: #555a70;
    padding: 6px 16px; border: 1px solid rgba(255,255,255,0.08); border-radius: 8px;
  }
  @keyframes fade-up {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
  <div class="logo">gTabs</div>
  <div class="tagline">Open source. Free. Try it now.</div>
  <div class="url">github.com/vaddisrinivas/gtabs</div>
  <div class="badges">
    <div class="b">287 tests</div>
    <div class="b">Zero runtime deps</div>
    <div class="b">8 LLM providers</div>
    <div class="b">TypeScript</div>
  </div>
</body>
</html>
